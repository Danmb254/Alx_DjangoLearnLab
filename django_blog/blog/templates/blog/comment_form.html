<!-- blog/templates/blog/comment_form.html -->
{% extends "blog/base.html" %}
{% block content %}
<h2>{% if object %}Edit Comment{% else %}New Comment{% endif %}</h2>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">{% if object %}Update{% else %}Post{% endif %}</button>
</form>
<a href="{% url 'post_detail' pk=object.post.pk %}">Back</a>
{% endblock %}
